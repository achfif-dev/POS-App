name: Generate Release Keystore (jalankan SEKALI saja)
on:
  workflow_dispatch: {}

# Workflow SEKALI PAKAI: membuat keystore signing release secara otomatis di runner GitHub
# (karena kamu tidak punya Termux/terminal untuk jalankan keytool sendiri). Hasilnya berupa
# 2 file yang bisa didownload dari halaman run ini (Artifacts):
#   - release-keystore.jks   -> file keystore asli, SIMPAN baik-baik (backup ke Drive dll),
#                               ini kunci tanda tangan app kamu selamanya.
#   - keystore-info.txt      -> isi 4 nilai yang perlu kamu copy ke GitHub Secrets.
# SETELAH kamu copy semua ke Secrets, hapus run ini (Actions > run ini > "..." > Delete)
# supaya password tidak nyangkut di riwayat Actions.
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17 (untuk keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore + password acak
        run: |
          # PENTING: keytool modern (JDK 17+) membuat keystore format PKCS12 secara
          # default. Berbeda dari format JKS lama, PKCS12 TIDAK punya password terpisah
          # untuk private key -- hanya ada SATU password sungguhan (password keystore).
          # Karena itu di sini storepass dan keypass sengaja dibuat SAMA PERSIS. Kalau
          # dibuat beda, private key tidak akan bisa dibuka lagi walau storepass benar.
          STORE_PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 20)
          KEY_PASS="$STORE_PASS"
          ALIAS="posapp"

          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=POS App, OU=Dev, O=YAPIDA, L=Jakarta, S=Jakarta, C=ID"

          base64 -w 0 release-keystore.jks > keystore.b64

          {
            echo "=== SALIN 4 NILAI DI BAWAH INI KE GITHUB SECRETS ==="
            echo "CATATAN: RELEASE_KEYSTORE_PASSWORD dan RELEASE_KEY_PASSWORD SENGAJA sama"
            echo "persis (format PKCS12 tidak punya password key terpisah)."
            echo "PENTING: setiap value ada di baris tersendiri, di antara pembatas >>> dan <<<."
            echo "Copy PERSIS teks di antara pembatas itu saja (jangan ikut pembatasnya,"
            echo "jangan ikut baris kosong sebelum/sesudahnya)."
            echo ""
            echo "Secret name: RELEASE_KEYSTORE_BASE64"
            echo ">>>"
            cat keystore.b64
            echo ""
            echo "<<<"
            echo ""
            echo "Secret name: RELEASE_KEYSTORE_PASSWORD"
            echo ">>>"
            echo "$STORE_PASS"
            echo "<<<"
            echo ""
            echo "Secret name: RELEASE_KEY_ALIAS"
            echo ">>>"
            echo "$ALIAS"
            echo "<<<"
            echo ""
            echo "Secret name: RELEASE_KEY_PASSWORD"
            echo ">>>"
            echo "$KEY_PASS"
            echo "<<<"
            echo ""
            echo "=== SETELAH DI-COPY SEMUA, HAPUS RUN INI DARI TAB ACTIONS ==="
          } > keystore-info.txt

          {
            echo "## Salin 4 secret ini ke Settings > Secrets and variables > Actions"
            echo ""
            echo "Klik di dalam tiap kotak kode di bawah, select-all isinya (Ctrl/Cmd+A di"
            echo "dalam kotak itu saja), lalu copy. Ini menghindari ikut ter-copy-nya label"
            echo "atau baris kosong."
            echo ""
            echo "**RELEASE_KEYSTORE_BASE64**"
            echo '```'
            cat keystore.b64
            echo '```'
            echo ""
            echo "**RELEASE_KEYSTORE_PASSWORD**"
            echo '```'
            echo "$STORE_PASS"
            echo '```'
            echo ""
            echo "**RELEASE_KEY_ALIAS**"
            echo '```'
            echo "$ALIAS"
            echo '```'
            echo ""
            echo "**RELEASE_KEY_PASSWORD**"
            echo '```'
            echo "$KEY_PASS"
            echo '```'
            echo ""
            echo "Setelah semua tersimpan di Secrets, hapus run ini dari tab Actions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore file (backup asli - simpan baik-baik)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-BACKUP-INI
          path: release-keystore.jks
          retention-days: 7

      - name: Upload info (isi untuk GitHub Secrets)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-info
          path: keystore-info.txt
          retention-days: 7
