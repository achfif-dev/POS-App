name: Android CI Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      # Repo ini belum menyertakan gradlew/gradle-wrapper.jar (binary) agar tetap ringan
      # saat diupload manual lewat GitHub web UI. setup-gradle otomatis men-download &
      # cache Gradle yang sesuai, sehingga 'gradle' bisa dipanggil langsung tanpa wrapper.
      # Jika kamu sudah generate wrapper (gradle wrapper) di repo, ganti perintah di bawah
      # menjadi './gradlew ...' dan hapus step setup-gradle ini.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run Lint
        run: gradle lintDebug --stacktrace
      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # --- Signing release APK ---
      # Release APK WAJIB ditandatangani (signed) atau Android akan menolak instalnya sama
      # sekali ("App not installed"). Keystore disimpan sebagai GitHub Secret dalam bentuk
      # base64 (RELEASE_KEYSTORE_BASE64), lalu di-decode ke file sementara di runner sebelum
      # 'gradle assembleRelease' dijalankan. 4 secrets ini WAJIB dibuat di
      # Settings > Secrets and variables > Actions:
      #   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      # Kalau secrets belum diisi, step ini di-skip dan Release APK yang terupload TETAP
      # UNSIGNED (belum bisa diinstall) — itu tandanya secrets di atas belum kamu buat.
      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
